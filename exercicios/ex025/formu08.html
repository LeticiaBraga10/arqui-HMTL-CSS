<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.js">
       <p>
        <label for="iano">Ano de nascimento:</label>
        <input type="text" name="ano" id="iano" oninput="calc()" min="1900" max="2025">
    </p>
    <p>
        <label for="iidade">A sua idade:</label>
        <output id="iidade">0</output>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
    <script>
        function calc(){
            let atual = new Date().getFullYear()
            iidade.innerHTML=Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
