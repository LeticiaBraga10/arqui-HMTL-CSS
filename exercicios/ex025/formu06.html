<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.js" method="post" autocomplete="on">
        <fieldset>
            <p>
                <label for="icor">Cor</label>
                <input type="color" name="cor" id="icor" value="#00ff00">
            </p>
            <p>
                <label for="inivel">Nível de satisfação</label>
                <input type="range" name="nivel" id="inivel" min="1" max="100" value="50"><!--value, nesse caso serve para definir a posição inicial do medidor.-->
            </p>
            <p>
                <label for="ifoto"></label>
                <input type="file" name="foto" id="ifoto">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="enviar">
        </p>
    </form>
</body>
</html>
