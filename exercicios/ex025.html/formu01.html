<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <form action="cadastro.js">
        <p><label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" autocomplete="off"></p>
        <p><label for="isobrenome">Sobrenome:</label> 
            <input type="text" name="sobrenome" id="isobrenome" autocomplete="off"></p>
        <p><input type="submit" value="enviar"></p>
    </form>
</body>
</html>
