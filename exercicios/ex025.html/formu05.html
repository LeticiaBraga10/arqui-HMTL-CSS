<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>formulário</h1>
    <form action="cadastro.js" autocomplete="on" method="get">
        <fieldset >
            <legend>Sexo:</legend>
            <p>
                <input type="radio" name="sexo" id="ifem" required><label for="ifem">Feminino</label> <br> <br>

                <input type="radio" name="sexo" id="imasc" required><label for="imasc">Masculino</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <p>
                <input type="checkbox" name="fut" id="ifut"><label for="ifut">Futebol</label> <br>
                <input type="checkbox" name="basq" id="ibasq"><label for="ibasq">Basquete</label> <br>
                <input type="checkbox" name="nat" id="inat"><label for="inat">Natação</label> <br>
                <input type="checkbox" name="surf" id="isurf" checked><label for="isurf" >Surf</label> <br>
            </p>
        </fieldset>
         <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>
</body>
</html>
