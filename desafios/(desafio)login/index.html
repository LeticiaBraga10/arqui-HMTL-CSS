<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de login </title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=VT323&display=swap');
    </style>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
       <section id="login">
            <div id="imagem">
                <!--Foto (vai ser adicionada no css)-->
            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a). Faça login para acessar a sua conta.</p>

                <form action="login.js" method="post">
                    
                    <div class="campo">
                        <span class="material-icons">person</span>
                        <input type="email" name="login" id="ilogin" required placeholder="  Seu email.." maxlength="30">   
                        <label for="ilogin">Login</label> 
                    </div>

                    <div class="campo">
                        <span class="material-icons">lock</span>
                        <input type="password" name="senha" id="isenha" required placeholder="  Sua senha.." minlength="8" maxlength="15">
                        <label for="isenha">Senha</label>
                    </div>

                    <input type="submit" value="Enviar">
                    <a href="#" class="botao">Esqueci a senha <span class="material-icons">email</span></a>
                    
                </form>
            </div>
       </section>
    </main>
</body>
</html>
